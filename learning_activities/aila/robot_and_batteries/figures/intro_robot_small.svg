    </g>
    <g stroke="null" id="svg_88" transform="translate(348 865) scale(0.9 0.9)">
      <use transform="matrix(0.725275 0 0 0.809853 -338.64 -1.61573)" stroke="null" x="34.42113" y="-19.59154" id="svg_87" xlink:href="#battery"/>
    </g>
    <g stroke="null" id="svg_90" transform="translate(348 865) scale(0.9 0.9)">
    </g>
    <g stroke="null" id="svg_92" transform="translate(348 865) scale(0.9 0.9)">
    </g>
    <g stroke="null" id="svg_96" transform="translate(348 865) scale(0.9 0.9)">
    </g>
    <g stroke="null" id="svg_98" transform="translate(348 865) scale(0.9 0.9)">
    </g>
    <g stroke="null" id="svg_100" transform="translate(348 865) scale(0.9 0.9)">
    </g>
    <g stroke="null" id="svg_104" transform="translate(348 865) scale(0.9 0.9)">
    </g>
    <g stroke="null" id="svg_106" transform="translate(348 865) scale(0.9 0.9)">
    </g>
    <g stroke="null" id="svg_108" transform="translate(348 865) scale(0.9 0.9)">
    </g>
    <g stroke="null" id="svg_110" transform="translate(348 865) scale(0.9 0.9)">
