    <path stroke="#555" id="svg_32" stroke-linejoin="round" stroke-linecap="round" stroke-width="4" fill="none" d="m209,386l0,216.09338m0,0l-139,214.21431m139,-214.21431l139,214.21431" class="link"/>
    <circle id="svg_33" stroke-width="4" stroke="#333" fill="#ff9416" r="17" cy="386" cx="209" class="node"/>
    <circle id="svg_34" stroke-width="4" stroke="#333" fill="#ff9416" r="17" cy="616" cx="209" class="node"/>
    <g stroke="null" id="svg_37" transform="translate(348 865) scale(0.9 0.9)">
